{# Espera: q, diretor_sel, categoria_sel, diretores, categorias #}
<form method="get" class="filtros" id="form-filtros" role="search">
  <label class="campo campo--busca">
    <span class="sr-only">Pesquisar filme</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" name="q" value="{{ q }}" placeholder="Pesquisar por título…" autocomplete="off">
  </label>

  <label class="campo">
    <span class="campo__rotulo">Diretor</span>
    <select name="diretor" data-autosubmit>
      <option value="">Todos</option>
      {% for d in diretores %}
        <option value="{{ d.pk }}" {% if d.pk|stringformat:"s" == diretor_sel %}selected{% endif %}>{{ d.nome }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="campo">
    <span class="campo__rotulo">Categoria</span>
    <select name="categoria" data-autosubmit>
      <option value="">Todas</option>
      {% for c in categorias %}
        <option value="{{ c.pk }}" {% if c.pk|stringformat:"s" == categoria_sel %}selected{% endif %}>{{ c.nome }}</option>
      {% endfor %}
    </select>
  </label>

  <button type="submit" class="btn btn--primary">Buscar</button>
  {% if filtrando %}
    <a href="{% url 'catalogo:lista_filmes' %}" class="btn btn--ghost">Limpar</a>
  {% endif %}
</form>
